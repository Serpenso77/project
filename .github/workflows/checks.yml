name: Store checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Store API and media tests
        run: npm test
      - name: Marketplace export and import tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
